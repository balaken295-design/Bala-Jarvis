<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030b14"><meta name="description" content="BALA JARVIS personal AI assistant"><link rel="manifest" href="/manifest.webmanifest"><title>BALA JARVIS</title><style>
:root{color-scheme:dark;--c:#35dcff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at center,#0b2940,#030b14 70%);color:#d9f8ff;font:16px "Segoe UI",sans-serif}header{text-align:center;padding:22px}h1{letter-spacing:.4em;font-weight:300;color:var(--c);text-shadow:0 0 18px var(--c)}main{max-width:1100px;margin:auto;padding:12px;display:grid;grid-template-columns:250px 1fr;gap:16px}.panel{border:1px solid #15506a;border-radius:14px;background:#041522dd;padding:16px}.metric{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #12394b}.metric b{color:var(--c)}#orb{display:block;width:220px;max-width:70%;margin:8px auto 18px;border:1px solid #15506a;border-radius:50%;box-shadow:0 0 40px #087da055}#log{height:260px;overflow:auto;padding:10px;background:#020b12;border-radius:8px}.you{color:#b6eaff}.jar{color:var(--c);margin-bottom:10px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}input{flex:1 1 100%;padding:13px;background:#061c2a;border:1px solid #1a6682;border-radius:8px;color:white}button{flex:1;padding:12px;background:#073047;border:1px solid var(--c);border-radius:8px;color:var(--c)}.active{background:var(--c);color:#00131d}@media(max-width:700px){main{grid-template-columns:1fr}}</style></head><body><header><h1>BALA JARVIS</h1><div id="status">SYSTEM READY · LOCAL MODE</div></header><main><section class="panel"><h3>SYSTEM STATUS</h3><div class="metric">CPU <b id="cpu">--</b></div><div class="metric">RAM <b id="ram">--</b></div><div class="metric">DISK <b id="disk">--</b></div><div class="metric">BATTERY <b id="battery">--</b></div><div class="metric">NET UP <b id="up">--</b></div><div class="metric">NET DOWN <b id="down">--</b></div></section><section class="panel"><canvas id="orb" width="220" height="220"></canvas><div id="log"></div><div class="controls"><input id="msg" placeholder="Ask BALA JARVIS…" autocomplete="off"><button id="send">Send</button><button id="mic">🎙 Listen</button><button id="lang">EN / தமிழ்</button></div></section></main><script>
const $=x=>document.getElementById(x);let lang="en-IN",active=false,rec;function log(cls,s){let d=document.createElement("div");d.className=cls;d.textContent=(cls==="you"?"YOU: ":"JARVIS: ")+s;$("log").append(d);$("log").scrollTop=1e6}
function speak(s){if(!speechSynthesis)return;let u=new SpeechSynthesisUtterance(s);u.lang=/[\u0B80-\u0BFF]/.test(s)?"ta-IN":"en-IN";speechSynthesis.cancel();speechSynthesis.speak(u)}
async function ask(s){s=s.trim();if(!s)return;log("you",s);$("status").textContent="THINKING…";try{let r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:s})}),d=await r.json();log("jar",d.reply);speak(d.reply);$("status").textContent="READY"}catch(e){log("jar","Cannot reach the local server.")}}
$("send").onclick=()=>{let s=$("msg").value;$("msg").value="";ask(s)};$("msg").onkeydown=e=>{if(e.key==="Enter")$("send").click()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;function startMic(){if(!SR){$("status").textContent="Use Chrome or Edge for speech";return}if(active)return;rec=new SR();rec.lang=lang;rec.onresult=e=>ask(e.results[0][0].transcript);rec.onend=()=>{active=false;$("mic").classList.remove("active")};rec.onerror=()=>{$("status").textContent="Microphone blocked — tap Listen and allow permission"};active=true;$("mic").classList.add("active");try{rec.start()}catch(e){active=false;$("mic").classList.remove("active");$("status").textContent="Tap Listen to start microphone"}}$("mic").onclick=()=>{if(active){rec.stop();return}startMic()};if(new URLSearchParams(location.search).get("wake")==="1"){setTimeout(startMic,1200)}$("lang").onclick=()=>{lang=lang==="en-IN"?"ta-IN":"en-IN";$("status").textContent="LANGUAGE "+lang};
async function poll(){try{let s=await(await fetch("/stats")).json();["cpu","ram","disk"].forEach(k=>$(k).textContent=s[k].toFixed(0)+"%");$("battery").textContent=s.battery?s.battery.pct+"%"+(s.battery.plugged?" ⚡":""):"AC";$("up").textContent=s.up+" KB/s";$("down").textContent=s.down+" KB/s"}catch(e){}}setInterval(poll,1800);poll();
let c=$("orb"),g=c.getContext("2d"),t=0;function draw(){t+=.02;g.clearRect(0,0,220,220);g.strokeStyle="#35dcff";g.shadowColor="#35dcff";g.shadowBlur=20;for(let i=0;i<4;i++){g.beginPath();g.arc(110,110,32+i*19,t*(i%2?-1:1),t*(i%2?-1:1)+4.8);g.stroke()}g.fillStyle="#d9f8ff";g.font="16px Segoe UI";g.textAlign="center";g.fillText("BALA",110,115);requestAnimationFrame(draw)}draw();</script></body></html>
